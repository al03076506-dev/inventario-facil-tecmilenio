<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | Inventario Fácil</title><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-page"><main class="auth-card"><div class="brand"><span class="brand-icon">▣</span> Inventario Fácil</div><h1>Crea tu cuenta</h1><p class="muted">Empieza a gestionar productos en minutos.</p><form id="register-form"><label for="name">Nombre</label><input id="name" type="text" maxlength="80" required autocomplete="name" placeholder="Tu nombre"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required placeholder="tu@correo.com"><label for="password">Contraseña (mínimo 8 caracteres)</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button type="submit">Crear cuenta</button><p class="feedback" id="message" role="status" aria-live="polite"></p></form><p class="footer-text">¿Ya tienes cuenta? <a href="/">Inicia sesión</a></p></main><script src="/auth.js" defer></script></body></html>
