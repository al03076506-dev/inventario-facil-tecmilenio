<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Inventario Fácil</title><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-page"><main class="auth-card"><div class="brand"><span class="brand-icon">▣</span> Inventario Fácil</div><h1>¡Bienvenido!</h1><p class="muted">Inicia sesión para administrar tu inventario.</p><form id="login-form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required placeholder="tu@correo.com"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"><button type="submit">Entrar</button><p class="feedback" id="message" role="status" aria-live="polite"></p></form><p class="footer-text">¿No tienes cuenta? <a href="/register.html">Regístrate</a></p></main><script src="/auth.js" defer></script></body></html>
